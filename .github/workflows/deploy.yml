name: Deploy Notes Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create Backend Env
        run: |
          printf "%s" "${{ secrets.NOTES_BE_ENV }}" > $GITHUB_WORKSPACE/notes-be/.env

      - name: Create Frontend Env
        run: |
          printf "%s" "${{ secrets.NOTES_FE_ENV }}" > $GITHUB_WORKSPACE/notes-fe/.env

      - name: Ensure network exists
        run: |
          docker network inspect n8n-network >/dev/null 2>&1 || docker network create n8n-network

      - name: Build Backend
        run: |
          docker build \
            -t notes-be:${{ github.sha }} \
            -t notes-be:latest \
            $GITHUB_WORKSPACE/notes-be

      - name: Restart Backend
        run: |
          docker rm -f notes-api || true
          docker run -d \
            --name notes-api \
            -p 3003:3003 \
            --restart unless-stopped \
            --network n8n-network \
            --env-file $GITHUB_WORKSPACE/notes-be/.env \
            --cap-drop ALL \
            notes-be:${{ github.sha }}

      - name: Build Frontend
        run: |
          set -a
          . $GITHUB_WORKSPACE/notes-fe/.env
          set +a

          docker build \
            --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL \
            --build-arg VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID \
            -t notes-fe:${{ github.sha }} \
            -t notes-fe:latest \
            $GITHUB_WORKSPACE/notes-fe

      - name: Restart Frontend
        run: |
          docker rm -f notes || true
          docker run -d \
            --name notes \
            -p 5174:5174 \
            --restart unless-stopped \
            --network n8n-network \
            --cap-drop ALL \
            --cap-add SETGID \
            --cap-add SETUID \
            --cap-add NET_BIND_SERVICE \
            notes-fe:${{ github.sha }}

      - name: Cleanup Old Images
        if: always()
        run: |
          docker images notes-fe --format "{{.Tag}}" | \
            grep -v latest | sort | head -n -3 | \
            xargs -I {} docker rmi notes-fe:{} || true

          docker images notes-be --format "{{.Tag}}" | \
            grep -v latest | sort | head -n -3 | \
            xargs -I {} docker rmi notes-be:{} || true

      - name: Cleanup Env Files
        if: always()
        run: |
          rm -f $GITHUB_WORKSPACE/notes-be/.env
          rm -f $GITHUB_WORKSPACE/notes-fe/.env
