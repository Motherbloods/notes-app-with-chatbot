name: Deploy Notes with Manual Trigger

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Created Backend Env
        run: echo "${{secrets.NOTES_BE_ENV}}" > notes-be/.env

      - name: Created Frontend Env
        run: echo "${{secrets.NOTES_FE_ENV}}" > notes-fe/.env

      - name: Build Backend
        run: docker build -t notes-be ./notes-be

      - name: Restart Backend
        run: |
          docker network create n8n-network || true
          docker rm -f notes-api || true
          docker run -d \
          --name notes-api \
          -p 3003:3003 \
          --restart unless-stopped \
          --network n8n-network \
          notes-be

      - name: Build Frontend
        run: docker build -t notes-fe ./notes-fe

      - name: Restart Frontend
        run: |
          docker network create n8n-network || true
          docker rm -f notes-fe || true
          docker run -d \
          --name notes \
          -p 5174:5174 \
          --restart unless-stopped \
          --network n8n-network \
          notes-fe

      - name: Cleanup Env Files
        if: always()
        run: |
          rm -f notes-be/.env
          rm -f notes-fe/.env
